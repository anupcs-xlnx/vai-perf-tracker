[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-dashboard"
version = "0.1.0"
description = "Static dashboard bootstrap and workbook parsing foundation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
